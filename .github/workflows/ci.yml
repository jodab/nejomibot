# What the image's test stage runs, ShellCheck on the tools, and the amd64
# image build, for each push to main and each pull request. Nothing is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - run: shellcheck tools/*.sh

  image:
    # The same Podman as the release builds with (see release.yml)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # amd64 alone: the ARM ones, emulated, are most of the time, and the
      # release builds them, checking each runs as its platform before it
      # pushes any
      - run: tools/build-image.sh --platforms linux/amd64
