# Publishes the image to GitHub's container registry, as
# ghcr.io/OWNER/nejomibot:VERSION and :latest, for linux/amd64 and
# linux/arm64, when a release is published on GitHub. Nothing else publishes
# it. The release's tag is the version in pyproject.toml, such as v0.93.0.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release is the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [[ ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::The release is $GITHUB_REF_NAME, but pyproject.toml has $version"
            exit 1
          fi
      # For the image's other architecture, through QEMU
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Log in to ghcr.io
        run: podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, and push
        run: >-
          tools/build-image.sh
          --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --push "ghcr.io/${GITHUB_REPOSITORY,,}"
