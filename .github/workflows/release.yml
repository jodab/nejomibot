# Publishes the image to GitHub's container registry, as
# ghcr.io/OWNER/nejomibot:VERSION and :latest, for linux/amd64, linux/arm64
# and linux/arm/v7, when a release is published on GitHub. It goes to Docker
# Hub too, as docker.io/USER/nejomibot, when the repository has the variable
# DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN, and then README.md, as
# of the release, becomes the image's page there, with the repository's
# description. The token is a Docker Hub personal access token that may read,
# write and delete: Docker Hub wants all three to change a page. With the
# variable PYPI_PUBLISH set to true, the wheel and sdist go to PyPI as well.
# Nothing else publishes any of them. The release's tag is the version in
# pyproject.toml, such as v0.93.0.
#
# Each image pushed gets signed build provenance: which workflow built it,
# from which commit. It's keyless, signed through Sigstore for this
# workflow's identity, and GitHub keeps it, so there's no key to look after:
# gh attestation verify oci://IMAGE:VERSION --repo OWNER/nejomibot checks it.
# The files on PyPI get the same, as PyPI keeps it (PEP 740).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  image:
    # For Podman 5: ubuntu-24.04's Podman 4.9 built every platform's image
    # for amd64 from the Dockerfile's stage for the building machine, and
    # labelled them all arm/v7's (0.94.0)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write  # to push to ghcr.io
      # To sign the provenance as this workflow, and to keep it on GitHub
      id-token: write
      attestations: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release is the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [[ ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::The release is $GITHUB_REF_NAME, but pyproject.toml has $version"
            exit 1
          fi
      # For the image's ARM architectures, through QEMU, registered with the
      # F flag, so that containers can use it; qemu-user-static is only
      # another name for qemu-user-binfmt now
      - name: QEMU for ARM
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-binfmt
          # It brings the files; this registers them now, if systemd hasn't
          sudo systemctl restart systemd-binfmt
          for arch in aarch64 arm; do
            grep -q '^flags: .*F' "/proc/sys/fs/binfmt_misc/qemu-$arch" ||
              { echo "::error::QEMU for $arch isn't registered for containers"; exit 1; }
          done
      - name: Log in to ghcr.io
        run: podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Before the build, which then pulls the base image as this user too
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: podman login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io <<<"$DOCKERHUB_TOKEN"
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, test, and push
        run: |
          destinations=(--push "ghcr.io/${GITHUB_REPOSITORY,,}")
          if [[ -n $DOCKERHUB_USERNAME ]]; then
            destinations+=(--push "docker.io/$DOCKERHUB_USERNAME/nejomibot")
          fi
          tools/build-image.sh --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --digests "$RUNNER_TEMP/pushed" "${destinations[@]}"
          # As the attestation takes them: the digest's hex, two spaces, the name
          sed -E 's/^(.+)@sha256:([0-9a-f]{64})$/\2  \1/' "$RUNNER_TEMP/pushed" \
            >"$RUNNER_TEMP/subjects"
      - name: Attest the images' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects

  # Once the image is there, so the page never tells of one that isn't
  dockerhub-page:
    needs: image
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/nejomibot
          short-description: ${{ github.event.repository.description }}
          readme-filepath: README.md

  # The wheel and sdist for PyPI, with the translations compiled, as in the
  # image. Built apart from the job that publishes them, which alone may
  # sign as this workflow, as PyPA's guide has it.
  dist:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --locked --only-group translations tools/compile-translations.py
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Trusted publishing: PyPI trusts this workflow, in the environment pypi,
  # so no token is kept, and the files get attestations signed as it. Once
  # the images are out, so PyPI never has a release the registries don't.
  pypi:
    needs: [image, dist]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/nejomibot/
    permissions:
      id-token: write  # to publish, and sign the attestations, as this workflow
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
