# Pull requests for new versions: of the Python dependencies (uv.lock), the
# base images in the Dockerfile, by tag and digest, and the workflows' actions
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Including a new Python, such as python:3.16-slim (AGENTS.md, rule 13):
    # .python-version and requires-python change with it, and until
    # .python-version does, the image build fails, as uv finds no Python of
    # the version it names
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
