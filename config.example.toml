# nejomibot configuration. Copy to config.toml in the bot's data folder
# (/data/config.toml in the container) and fill in.
# Every setting can also be set as an environment variable NEJOMIBOT_<NAME>,
# which overrides this file (lists and tables as JSON); with all the required
# ones in the environment, the file can be left out.

# signal-cli-rest-api, in json-rpc mode: where it answers, as host:port. Next
# to the bot that's 127.0.0.1:8080, or e.g. signal:8080 in Docker Compose.
signal_service = "127.0.0.1:8080"
# The bot's account in signal-cli-rest-api: its phone number. Register or
# link it with signal-account.sh once the bot runs; it waits till then.
account = "+46700000000"

# The language the bot answers in: en, or sv for Swedish. The translations
# are in nejomibot/locale, with each language's own names for the commands.
language = "en"

# https://openweathermap.org/api
openweather_api_key = "your-api-key"
weather_city = "Stockholm"
# weather_city_name = "Sthlm"  # how the weather post names it, if not so
weather_units = "metric"  # or "imperial"
# /weather Helsinki is the weather in Helsinki: the bot asks OpenWeatherMap
# about such places at most this many times an hour, finding them included.
# weather_city, as in /today, isn't counted. Each place's weather is kept for
# 10 minutes.
# weather_calls_per_hour = 10

# /today names the day's holidays, flag days and traditions of these
# countries atop the weather, by their codes, such as "SE" Sweden, "GR"
# Greece, "GB" the United Kingdom or "US" the United States: the 27 of the
# European Union, Norway, Iceland, Switzerland, the United Kingdom, the
# United States, Canada, Australia and New Zealand (see the README). None if
# not set.
# holidays = ["SE", "GR"]

# The time zone of the bot: timers, and the times it shows
timezone = "Europe/Stockholm"

photos_dir = "/photos"  # only read
# Where the bot keeps what it's told: the timers, the specials, the allowed
# list, the admins added, the reminders, the lists, the birthdays, the photos
# sent this round, and its backups. It must be there; only the bot's user may
# read it.
data_dir = "/data"
# Where photos that don't say their time zone were taken, if not in timezone
# photos_timezone = "Europe/Helsinki"
# With a birth date, a photo's caption shows the age of who's in the photos
# that day, after the emoji
# photos_birth_date = 2020-01-31
# photos_age_emoji = "🎂"
# A photo's caption links to where it was taken: "google" (Google Maps) or
# "openstreetmap"
# photos_map = "google"
# HEIC/HEIF photos are sent as JPEG; false leaves them out, which saves the
# 3 MB or so of memory it takes to open them (tools/tidy-photos.sh converts
# them for good)
# photos_heif = true

# /info shows the time in these places, by name, and an exchange rate
clocks = { "🇸🇪 Stockholm" = "Europe/Stockholm", "🇫🇮 Helsinki" = "Europe/Helsinki" }
exchange_rate = ["EUR", "SEK"]

# The fortune library /fortune picks from when none is named: one that
# /fortune list names, such as "wisdom", or "all" for every one of them.
# fortune_library = "fortunes_svenska"

# Messages that couldn't be sent (signal-cli-rest-api down, no internet) are
# tried again for this many hours, then dropped. Kept in data_dir meanwhile,
# they outlast a restart.
send_retry_hours = 3

# /delivery, for the admins, shows this many of the bot's latest messages, of
# those it sent in the last day, and how many phones confirmed each with a
# delivery receipt, and read it
# delivery_messages = 30

# Every day at backups_at, in timezone, and at a start if the latest is a
# day old, the bot backs up what it keeps in data_dir, its config and this
# sample, as nejomibot-2026-10-19_0400.tar.zst, into backups_dir:
# data_dir/backups if not set, or a folder of its own the bot's user may
# write in, best on another disk (in the container, mount one). None when
# nothing has changed since the latest. It keeps the newest backups_kept.
# /status and the health check pings say how old they are.
# backups = true
# backups_at = "04:00"
# backups_dir = "/backups"
# backups_kept = 30

# The admins, by phone number, or by Signal ID for those who don't share
# their number. They may use every command: the everyday ones anywhere
# they're allowed, and the admin commands (/status, /today preview, the
# specials, /contacts, /trust, /allowed, /allow, /disallow, /admins, /admin,
# the profile commands, the timers, /msg, /run, /birthday and /nameday) only
# in a direct chat with the bot; /delete in any chat. They hear from the bot
# of an update, a crash, a rate limit and a changed safety number. They may
# make others admins with /admin add, who may then use every command but
# /admin add and remove, but no command can take away what those here may
# do. Everyone else is let in with /allow. The bot's greeting, for those on
# the allowed list who write to it but send no command, names the first to
# contact.
admins = [
    "+46700000001",  # you
]

# How much the bot logs: "INFO", the commands by name and the kind of chat;
# "DEBUG" adds who sent them, what follows the name, and whom messages go
# to; "WARNING" only what goes wrong
# log_level = "INFO"

# Every healthcheck_minutes the bot checks signal-cli-rest-api, itself, and
# Signal's servers with its account, and logs what fails. With a health check
# URL to report to, such as https://hc-ping.com/<uuid> from healthchecks.io,
# it then pings the URL, or the URL with /fail and what failed. Each ping also
# says the versions of the bot and signal-cli-rest-api, the bot's uptime and
# its memory.
# healthcheck_url = "https://hc-ping.com/your-uuid"
# healthcheck_minutes = 5

# NEJOMIBOT_DEBUG=1 talks only to this group (and the admins); see README
# debug_group = "group.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx="

# Other names for commands, one word each, with or without /. Tables go
# last in the file.
[aliases]
"/photo" = ["/pic", "pic"]
