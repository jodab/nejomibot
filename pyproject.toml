[project]
name = "nejomibot"
version = "0.99.39"
description = "A Signal bot for a family or a group of friends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.15"
keywords = ["signal", "bot", "signal-cli", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "signalbot==2.2.0",
    "aiohttp>=3.11",
    "pillow>=13.0",
    "pillow-heif>=1.8",
    "pydantic-settings>=2.11",
    "python-dateutil>=2.9",
    "tzdata",
    "segno>=1.6.6",
]

[project.urls]
Source = "https://github.com/jodab/nejomibot"
Documentation = "https://github.com/jodab/nejomibot#readme"
Changelog = "https://github.com/jodab/nejomibot/blob/main/CHANGELOG.md"
Issues = "https://github.com/jodab/nejomibot/issues"
"Container image" = "https://hub.docker.com/r/jodab/nejomibot"

[project.scripts]
nejomibot = "nejomibot.bot:main"
nejomibot-healthcheck = "nejomibot.healthcheck:main"
nejomibot-timers = "nejomibot.timers_cli:main"
nejomibot-chat = "nejomibot.chat_cli:main"
nejomibot-account = "nejomibot.account_cli:main"
nejomibot-help = "nejomibot.guide:main"

[dependency-groups]
dev = [
    { include-group = "translations" },
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "types-polib>=1.2.0.20260518",
    "types-python-dateutil",
]
# Compiles the translations for the image and the wheel
# (tools/compile-translations.py), and reads them from a checkout, where
# there's none compiled
translations = ["polib>=1.2"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
# The wheel has the translations compiled, as .mo files, without what they're
# compiled from, nor the templates new languages start from
wheel-exclude = [
    "nejomibot/locale/*.po",
    "nejomibot/locale/messages.pot",
    "nejomibot/locale/template.toml",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "PTH",          # pathlib over os.path
    "ASYNC",        # blocking calls in async code
    "G", "LOG",     # logging
    "RUF",
]
# Typography in the bot's messages: dashes, and icons that look like + and -
allowed-confusables = ["–", "➕", "➖"]

[tool.pyright]
include = ["nejomibot", "tests", "tools"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# For tests/helpers.py, in any import mode
pythonpath = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    # signalbot's SQLite storage, which every SignalBot opens and nothing closes
    "ignore:unclosed database:ResourceWarning",
]
