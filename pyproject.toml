[project]
name = "nejomibot"
version = "0.99.20"
description = "Signal bot that posts the weather and a photo of the day"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.14"
dependencies = [
    "signalbot==2.1.3",
    "aiohttp>=3.11",
    "pillow>=13.0",
    "pillow-heif>=1.8",
    "pydantic-settings>=2.11",
    "python-dateutil>=2.9",
    "tzdata",
    # In place of phonenumbers, which signalbot asks for (see [tool.uv]): the
    # same, without the 40 MB of place names, carriers and time zones that
    # signalbot, checking only that a number is valid, never reads
    "phonenumberslite>=8.13.54",
]

[project.scripts]
nejomibot = "nejomibot.bot:main"
nejomibot-healthcheck = "nejomibot.healthcheck:main"
nejomibot-timers = "nejomibot.timers_cli:main"

[dependency-groups]
dev = [
    { include-group = "translations" },
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "types-polib>=1.2.0.20260518",
    "types-python-dateutil",
]
# Compiles the translations as the image is built, and reads them from a
# checkout, where there's none compiled
translations = ["polib>=1.2"]

[tool.uv]
exclude-dependencies = ["phonenumbers"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "PTH",          # pathlib over os.path
    "ASYNC",        # blocking calls in async code
    "G", "LOG",     # logging
    "RUF",
]
# Typography in the bot's messages: dashes, and icons that look like + and -
allowed-confusables = ["–", "➕", "➖"]

[tool.pyright]
include = ["nejomibot", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# For tests/helpers.py, in any import mode
pythonpath = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    # signalbot's SQLite storage, which every SignalBot opens and nothing closes
    "ignore:unclosed database:ResourceWarning",
]
