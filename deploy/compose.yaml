# nejomibot and signal-cli-rest-api, for Docker Compose or podman-compose:
# docker compose up -d, beside the folders below.
#
# The bot reaches signal-cli-rest-api as signal:8080 on the compose network.
# No port is published: signal-cli-rest-api has no authentication, so anyone
# who reaches it controls the Signal account.

services:
  signal:
    # A build after 0.101, the latest release: 0.101 crashes on overlapping
    # requests (#885), logs every message it receives (#892), and its native
    # signal-cli can't list linked devices (signal-cli#2119), which the bot's
    # health check does. Use the next release once there is one. This is the
    # CI build 1792710189-ci, by its digest, as CI builds' tags may not be kept.
    image: docker.io/bbernhard/signal-cli-rest-api@sha256:8544250552e8df0272f3b0ce77a5c03df098cae2146d8aa57d132336a42b4edd
    environment:
      # One signal-cli for every request, as signalbot needs, on Java: the
      # native one (json-rpc-native) has had bugs this hasn't, and 32-bit ARM
      # has none
      MODE: json-rpc
      # It keeps no pictures sent to the bot, so /avatar can't take one
      JSON_RPC_IGNORE_ATTACHMENTS: "true"
      JSON_RPC_IGNORE_STORIES: "true"
      JSON_RPC_TRUST_NEW_IDENTITIES: on-first-use
    volumes:
      # The Signal account's keys and messages: it must belong to the user
      # signal-cli-rest-api runs as, uid 1000 (chown 1000 signal)
      - ./signal:/home/.local/share/signal-cli
    restart: unless-stopped

  nejomibot:
    # The same image is at ghcr.io/jodab/nejomibot
    image: docker.io/jodab/nejomibot:latest
    depends_on:
      - signal
    environment:
      NEJOMIBOT_SIGNAL_SERVICE: signal:8080
      TZ: Europe/Stockholm  # for the log's times
    volumes:
      # The photo library, which the bot only reads
      - ./photos:/photos:ro
      # config.toml, and what the bot keeps: it must belong to the bot's
      # user, uid 1000 (chown 1000 data)
      - ./data:/data
    # The bot's user and group, 1000 both unless given others here, such as
    # "1001:1001", who must then own data instead
    # user: "1000:1000"
    restart: unless-stopped
    # It needs no privileges, and writes only to /data, and the tools to /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    # An init process, which passes SIGTERM on, and reaps what the tools leave
    init: true
