# nejomibot's settings, which nejomibot --example-config prints: start
# config.toml from them. The bot reads ./config.toml, or the file
# NEJOMIBOT_CONFIG names, /data/config.toml in the image. NEJOMIBOT_<SETTING>
# variables override any of them, lists and tables as JSON; with every
# required one set there, the file may be left out.

# signal-cli-rest-api, in json-rpc mode, as host:port: signal:8080 with
# Compose, 127.0.0.1:8080 when the bot shares its network
signal_service = "127.0.0.1:8080"
# The bot's account: its phone number, or for an account without one, its
# Signal ID. The bot waits until nejomibot-account has registered or linked it.
account = "+46700000000"

# The default language: en, da, de, el, es, fi, fr, nb or sv. /language sets
# a chat's own.
language = "en"
# How the bot shows commands: ".", "!" or "/". It takes all three.
# command_prefix = "."

# https://openweathermap.org/api
openweather_api_key = "your-api-key"
weather_city = "Stockholm"
# weather_city_name = "Sthlm"  # the name the weather post shows
weather_units = "metric"  # or "imperial"
# Lookups and calls an hour for places other than weather_city, which
# /weather <place> makes; each place's weather is kept for 10 minutes.
# weather_calls_per_hour = 10

# Countries whose holidays and observances /today names, by code: the EU's,
# NO, IS, CH, GB, US, CA, AU and NZ. None by default.
# holidays = ["SE", "GR"]

# The bot's time zone: the timers, and every time it shows
timezone = "Europe/Stockholm"

# The image's folders; elsewhere, such as "photos" and "data" beside
# config.toml
photos_dir = "/photos"  # read only
# What the bot keeps: it must exist, and belong to the bot's user alone
data_dir = "/data"
# The time zone of photos that don't record theirs, if not timezone
# photos_timezone = "Europe/Helsinki"
# The birth date captions count an age from, for the photos in no album;
# /album sets an album's. photos_age_emoji goes before the age.
# photos_birth_date = 2020-01-31
# photos_age_emoji = "🎂"
# Where a photo's map link goes: "google" or "openstreetmap"
# photos_map = "google"
# HEIC/HEIF photos are sent as JPEG; false leaves them out, saving about 3 MB
# of memory (tools/tidy-photos.sh converts them for good)
# photos_heif = true

# /info: the time in these places, and an exchange rate
clocks = { "🇸🇪 Stockholm" = "Europe/Stockholm", "🇫🇮 Helsinki" = "Europe/Helsinki" }
exchange_rate = ["EUR", "SEK"]

# The library /fortune picks from: one /fortune list names, or "all"
# fortune_library = "fortunes_svenska"

# Hours a message that couldn't be sent is tried again, then dropped; it's
# kept in data_dir meanwhile
send_retry_hours = 3
# While Signal rate-limits the bot, the most minutes between its tries
# rate_limit_retry_minutes = 30

# Commands the bot answers each person in command_limit_minutes; the admins,
# timers, /run and specials aren't limited
# command_limit = 20
# command_limit_minutes = 10

# How many of its latest messages /delivery shows
# delivery_messages = 30

# Whether nejomibot-chat lists the files of received messages, for --save.
# signal-cli keeps them only with JSON_RPC_IGNORE_ATTACHMENTS=false.
# received_attachments = false

# The admins, by phone number, or by Signal ID for those without one. They
# use every command, the admin commands in a direct chat only, get the
# notices, and add admins with /admin add. Timers run as the first, whom
# the greeting names.
admins = [
    "+46700000001",  # you
    # "0f1e2d3c-4b5a-4968-8778-695a4b3c2d1e",  # someone without a number
]
# The admins' message at each start
# startup_notice = true

# The profile, for the parts data_dir/bot.txt doesn't have yet: bot.txt keeps
# every change from /name, /about, /avatar, /username and nejomibot-account,
# and each start sends only what differs from the account's profile
# bot_name = "Mybot"
# bot_about = "Weather and photos"
# bot_avatar = "/data/avatar.png"
# bot_username = "mybot"

# "INFO": commands by name and the kind of chat; "DEBUG" adds who, what and
# to whom; "WARNING": only what goes wrong
# log_level = "INFO"

# The health checks, every healthcheck_minutes, and the URL each round pings,
# such as healthchecks.io's https://hc-ping.com/<uuid>, or with /fail
# healthcheck_url = "https://hc-ping.com/your-uuid"
# healthcheck_minutes = 5
# The delivery check fails when phones confirm none of three messages in a
# row within this many hours (at most 24)
# unconfirmed_hours = 12

# NEJOMIBOT_DEBUG=1 talks only to this group and the admins
# debug_group = "group.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx="

# Other names for commands, a word each starting with /, . or ! (a plain word
# gets a /). Tables go last in the file.
[aliases]
"/photo" = ["/pic"]
